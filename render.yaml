services:
  - type: web
    name: tarjeta-digital
    env: node
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OWNER_PHONE
        value: "522311556138"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: BASE_URL
        sync: false

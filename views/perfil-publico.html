<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VYNK | Perfil Inteligente</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/vynk-cards.css">
</head>
<body>
    <div id="vynk-app"></div>

    <script src="/js/vynk-renderer.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const profileData = {
                theme: {
                    primaryColor: '#FBBF24',
                    backgroundColor: '#0A0A0A'
                },
                header: {
                    avatar: '/img/default-avatar.png',
                    name: 'La Capital Local',
                    bio: 'Medio digital independiente y periodismo hiperlocal.',
                    badge: 'Verificado'
                },
                blocks: [
                    {
                        type: 'hero_link',
                        title: 'Envía una denuncia',
                        meta: 'Atención 24/7 vía WhatsApp',
                        badge: 'WhatsApp',
                        url: 'https://wa.me/1234567890'
                    },
                    {
                        type: 'social_grid',
                        items: [
                            { icon: '📸', label: 'Instagram', url: '#' },
                            { icon: '🐦', label: 'Twitter / X', url: '#' },
                            { icon: '📺', label: 'YouTube', url: '#' },
                            { icon: '📰', label: 'Boletín', url: '#' }
                        ]
                    },
                    {
                        type: 'location_map',
                        title: '📍 Redacción Central',
                        subtitle: 'Ven a visitarnos o calcula tu ruta.',
                        locationName: 'Oficinas La Capital',
                        address: 'Av. Reforma 123, Centro Histórico'
                    }
                ]
            };

            // Iniciar renderizado
            renderVynkProfile(profileData, 'vynk-app');
        });
    </script>
</body>
</html>

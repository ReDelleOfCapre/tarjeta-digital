<!DOCTYPE html>
<html lang="es" data-theme="{{tema}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>{{nombre_perfil}} — VYNK</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-title" content="VYNK">
  <meta name="description" content="{{bio_text}}">
  <meta property="og:title" content="{{nombre_perfil}}">
  <meta property="og:description" content="{{bio_text}}">
  <meta property="og:image" content="{{og_image}}">
  <meta property="og:url" content="{{base_url}}/u/{{slug}}">
  <meta property="og:type" content="profile">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="{{color}}" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --profile-color: {{color}};
      --bg-primary: #0F0B1E;
      --bg-card: rgba(255,255,255,0.06);
      --text-primary: #FFFFFF;
      --text-secondary: rgba(255,255,255,0.7);
      --border-color: rgba(255,255,255,0.1);
      --shadow-color: rgba(0,0,0,0.5);
      --glass-bg: rgba(15, 11, 30, 0.7);
    }
    
    @media (prefers-color-scheme: light) {
      :root {
        --bg-primary: #F5F5F7;
        --bg-card: rgba(0,0,0,0.04);
        --text-primary: #1C1C1E;
        --text-secondary: rgba(0,0,0,0.6);
        --border-color: rgba(0,0,0,0.08);
        --shadow-color: rgba(0,0,0,0.1);
        --glass-bg: rgba(245, 245, 247, 0.7);
      }
    }
    
    /* THEME OVERRIDES */
    {{tema_css}}
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
      width: 100%;
    }
    
    /* Animated Background Mesh */
    .bg-mesh {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: -1;
      overflow: hidden;
      background: var(--bg-primary);
    }
    .bg-mesh::before, .bg-mesh::after {
      content: '';
      position: absolute;
      width: 60vmax; height: 60vmax;
      border-radius: 50%;
      background: var(--profile-color);
      opacity: 0.15;
      filter: blur(100px);
      animation: float 20s infinite alternate ease-in-out;
    }
    .bg-mesh::before { top: -20%; left: -10%; }
    .bg-mesh::after { bottom: -20%; right: -10%; animation-delay: -10s; }
    
    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(10%, 20%) scale(1.2); }
    }
    
    a { color: inherit; text-decoration: none; }
    
    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 0 16px;
      width: 100%;
      box-sizing: border-box;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding-bottom: 100px;
      overflow-x: hidden;
    }
    
    /* HEADER & AVATAR INTEGRITY (Cero Filtros en Imagen) */
    .header {
      text-align: center;
      padding-top: 48px;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    .header.visible { opacity: 1; transform: translateY(0); }
    
    .avatar-wrapper {
      position: relative;
      width: 120px; height: 120px;
      margin: 0 auto 20px;
      border-radius: 50%;
      padding: 4px;
      background: var(--profile-color);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    
    .avatar {
      width: 100% !important; height: 100% !important;
      border-radius: 50%;
      border: 3px solid var(--bg-primary) !important;
      overflow: hidden;
      background: var(--bg-primary);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.5rem !important; font-weight: 800;
      filter: none !important;
      mix-blend-mode: normal !important;
    }
    .avatar img {
      width: 100%; height: 100%; object-fit: cover;
      filter: none !important;
      mix-blend-mode: normal !important;
      opacity: 1 !important;
    }
    
    .name {
      font-size: 2rem; font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      background: linear-gradient(to right, var(--text-primary), var(--profile-color));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .bio {
      font-size: 1rem; color: var(--text-secondary);
      max-width: 380px; margin: 0 auto; line-height: 1.6;
    }
    
    .tags {
      display: flex; justify-content: center; gap: 8px;
      margin-top: 16px; flex-wrap: wrap;
    }
    .tag {
      background: var(--bg-card);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 6px 14px; border-radius: 20px;
      font-size: 0.8rem; font-weight: 600;
      color: var(--text-primary);
      border: 1px solid var(--border-color);
    }
    
    /* BLOCKS SECTION & BENTO GRID LAYOUT FOR DESKTOP */
    .blocks-section { display: flex; flex-direction: column; gap: 16px; width: 100%; }

    @media (min-width: 1024px) {
      .container {
        max-width: 900px !important;
        padding: 0 32px !important;
      }
      .blocks-section {
        display: grid !important;
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 16px !important;
        align-items: start !important;
      }
      .block-wrapper.has-bento-rich,
      .block-wrapper.block-spotify,
      .block-wrapper.block-youtube,
      .block-wrapper.block-tweet,
      .block-wrapper.block-tiktok,
      .block-wrapper.block-seccion,
      .block-wrapper.block-pdf,
      .block-wrapper.block-galeria,
      .block-wrapper.block-countdown,
      .block-wrapper.block-pago {
        grid-column: span 2 !important;
      }
    }
    
    .block-wrapper {
      width: 100%;
      box-sizing: border-box;
      opacity: 0; transform: translateY(20px);
      transition: opacity 0.5s ease, transform 0.5s ease;
      background: transparent !important;
      border: none !important;
      padding: 0 !important;
      margin: 0 !important;
      overflow: hidden;
    }
    .block-wrapper.visible { opacity: 1; transform: translateY(0); }
    
    /* Link Block */
    .block-link {
      display: flex; align-items: center; gap: 14px;
      padding: 16px; border-radius: 20px;
      width: 100%; box-sizing: border-box;
      background: var(--bg-card);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      box-shadow: 0 4px 12px var(--shadow-color);
      cursor: pointer; overflow: hidden;
      text-decoration: none;
    }
    .block-link:hover {
      transform: translateY(-3px);
      border-color: var(--profile-color);
      box-shadow: 0 8px 20px var(--shadow-color);
    }
    .block-link:active { transform: scale(0.98); }
    
    .bl-icon {
      width: 44px; height: 44px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; background: rgba(255,255,255,0.08);
      color: var(--text-primary);
      flex-shrink: 0;
    }
    .bl-text { flex: 1; min-width: 0; overflow: hidden; }
    .bl-title { font-weight: 700; font-size: 1rem; color: var(--text-primary); line-height: 1.3; word-break: break-word; overflow-wrap: break-word; }
    .bl-sub { font-size: 0.825rem; color: var(--text-secondary); margin-top: 3px; line-height: 1.3; word-break: break-word; overflow-wrap: break-word; }
    .bl-arrow { color: var(--text-secondary); opacity: 0.5; transition: transform 0.3s; flex-shrink: 0; }
    .block-link:hover .bl-arrow { transform: translateX(4px); opacity: 1; }
    
    /* WhatsApp Block */
    .block-wa {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      padding: 18px; border-radius: 20px;
      background: linear-gradient(135deg, #25D366, #128C7E);
      color: #fff; font-weight: 700; font-size: 1.2rem;
      box-shadow: 0 10px 20px rgba(37,211,102,0.3);
      transition: all 0.3s ease;
      position: relative; overflow: hidden;
    }
    .block-wa::after {
      content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.3), transparent);
      transform: skewX(-20deg); animation: shine 3s infinite;
    }
    @keyframes shine { 0% { left: -100%; } 20% { left: 200%; } 100% { left: 200%; } }
    .block-wa:hover { transform: translateY(-4px) scale(1.02); box-shadow: 0 15px 25px rgba(37,211,102,0.4); }
    
    /* Social Icons Block */
    .block-socials { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; padding: 10px 0; }
    .social-icon {
      width: 56px; height: 56px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; color: #fff;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
      position: relative;
    }
    .social-icon::before {
      content: ''; position: absolute; inset: -4px; border-radius: 50%;
      border: 2px solid transparent; transition: all 0.3s;
    }
    .social-icon:hover { transform: translateY(-6px) scale(1.1); }
    .social-icon:hover::before { border-color: inherit; transform: scale(1.1); opacity: 0; }
    
    /* Embed Block */
    .block-embed {
      border-radius: 20px; overflow: hidden;
      box-shadow: 0 8px 24px var(--shadow-color);
      background: var(--bg-card);
      border: 1px solid var(--border-color);
    }
    .block-embed iframe { width: 100%; border: none; display: block; }
    
    /* Text Block */
    .block-text {
      padding: 20px; border-radius: 20px;
      background: var(--bg-card); backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      color: var(--text-secondary); line-height: 1.7; font-size: 1.05rem;
    }
    .block-text.t-titulo { font-size: 1.5rem; font-weight: 800; color: var(--text-primary); background: transparent; border: none; padding: 10px 0 0; }
    .block-text.t-cita {
      font-style: italic; border-left: 4px solid var(--profile-color);
      border-radius: 0 20px 20px 0; font-size: 1.1rem;
    }
    
    /* Email Capture Block */
    .block-email {
      padding: 24px; border-radius: 20px;
      background: var(--bg-card); backdrop-filter: blur(12px);
      border: 1px solid var(--border-color); text-align: center;
      box-shadow: 0 10px 30px var(--shadow-color);
    }
    .block-email h3 { font-size: 1.2rem; font-weight: 700; margin-bottom: 16px; color: var(--text-primary); }
    .email-form-group { display: flex; gap: 12px; flex-direction: column; }
    @media (min-width: 400px) { .email-form-group { flex-direction: row; } }
    .block-email input {
      flex: 1; padding: 14px 20px; border-radius: 12px;
      border: 1px solid var(--border-color);
      background: rgba(255,255,255,0.05); color: var(--text-primary);
      font-family: inherit; font-size: 1rem; outline: none; transition: all 0.3s;
    }
    .block-email input:focus { border-color: var(--profile-color); background: rgba(255,255,255,0.1); }
    .block-email button {
      padding: 14px 24px; border-radius: 12px; border: none;
      background: linear-gradient(135deg, var(--profile-color), var(--text-primary));
      color: var(--bg-primary); font-weight: 700; font-size: 1rem;
      cursor: pointer; transition: all 0.3s;
    }
    .block-email button:hover { transform: translateY(-2px); box-shadow: 0 4px 12px var(--profile-color); }
    
    /* Countdown Block */
    .block-countdown {
      padding: 24px; border-radius: 20px; text-align: center;
      background: var(--bg-card); backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
    }
    .block-countdown h3 { font-size: 1rem; color: var(--text-secondary); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }
    .cd-digits { display: flex; justify-content: center; gap: 16px; }
    .cd-unit {
      background: rgba(0,0,0,0.2); padding: 12px; border-radius: 12px;
      min-width: 70px; border: 1px solid rgba(255,255,255,0.05);
    }
    @media (prefers-color-scheme: light) { .cd-unit { background: rgba(255,255,255,0.5); } }
    .cd-num { font-size: 2.5rem; font-weight: 800; color: var(--profile-color); line-height: 1; }
    .cd-lbl { font-size: 0.7rem; text-transform: uppercase; color: var(--text-secondary); margin-top: 4px; font-weight: 600; }
    
    /* Gallery Block */
    .block-gallery { display: flex; gap: 16px; overflow-x: auto; padding: 10px 0; scroll-snap-type: x mandatory; scrollbar-width: none; }
    .block-gallery::-webkit-scrollbar { display: none; }
    .gallery-item {
      flex: 0 0 85%; scroll-snap-align: center; border-radius: 20px;
      overflow: hidden; position: relative; box-shadow: 0 8px 20px var(--shadow-color);
      border: 1px solid var(--border-color);
    }
    .gallery-item img { width: 100%; height: 260px; object-fit: cover; transition: transform 0.5s; }
    .gallery-item:hover img { transform: scale(1.05); }
    .gallery-caption {
      position: absolute; bottom: 0; left: 0; right: 0; padding: 20px;
      background: linear-gradient(transparent, rgba(0,0,0,0.9));
      color: #fff; font-size: 1rem; font-weight: 600;
    }
    
    /* Contact and Files sections (if any) */
    .section {
      background: var(--bg-card); backdrop-filter: blur(10px);
      border-radius: 20px; padding: 24px; border: 1px solid var(--border-color);
      margin-top: 16px;
    }
    .section-title { font-size: 0.9rem; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 20px; letter-spacing: 1px; font-weight: 700; }
    
    /* Save Bar */
    .save-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 20px; padding-bottom: max(20px, env(safe-area-inset-bottom));
      z-index: 50;
      background: var(--glass-bg);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-color);
      display: flex; justify-content: center;
    }
    .save-btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; max-width: 400px; padding: 16px 24px; border-radius: 50px;
      font-weight: 700; font-size: 1.1rem;
      background: linear-gradient(135deg, var(--profile-color), #fff);
      color: #000; text-decoration: none;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .save-btn:hover { transform: translateY(-4px) scale(1.02); box-shadow: 0 12px 30px rgba(255,255,255,0.2); }
    
    /* HERO BANNER PORTADA */
    .hero-banner {
      width: 100%;
      height: 160px;
      overflow: hidden;
      position: relative;
    }
    .hero-banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .hero-banner::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 30%, var(--bg-primary) 100%);
    }

    /* SECTION TITLE HEADERS */
    .block-section-title {
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--profile-color);
      margin: 16px 0 6px 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .block-section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, var(--border-color), transparent);
    }

    /* PAGO / TRANSFERENCIA CARD */
    .block-pago {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 4px 12px var(--shadow-color);
    }
    .pago-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
    }
    .pago-icon {
      width: 44px; height: 44px; border-radius: 12px;
      background: rgba(16, 185, 129, 0.15); color: #10B981;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; flex-shrink: 0;
    }
    .pago-title { font-weight: 700; font-size: 1rem; color: var(--text-primary); }
    .pago-sub { font-size: 0.825rem; color: var(--text-secondary); }
    .pago-clabe-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0,0,0,0.25);
      border: 1px dashed var(--border-color);
      padding: 10px 14px;
      border-radius: 12px;
    }
    .clabe-num { font-family: monospace; font-size: 0.95rem; font-weight: 700; color: #10B981; letter-spacing: 1px; }
    .btn-copy-clabe {
      background: #10B981; color: #fff; border: none; padding: 6px 14px;
      border-radius: 8px; font-weight: 700; font-size: 0.8rem; cursor: pointer;
      transition: all 0.2s;
    }
    .btn-copy-clabe:hover { transform: scale(1.05); }

    /* NOTA CARD */
    .block-nota {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 16px; padding: 14px 18px;
      color: var(--text-primary); font-size: 0.9rem;
      display: flex; align-items: center; gap: 12px;
    }
    .nota-icon { color: #F59E0B; font-size: 1.2rem; flex-shrink: 0; }

    .brand {
      text-align: center; color: var(--text-secondary);
      font-size: 0.8rem; padding: 20px; font-weight: 500;
    }
    .brand a { color: var(--profile-color); font-weight: 700; }
  </style>
</head>
<body>
  <div class="bg-mesh"></div>
  
  {{banner_html}}

  <header class="header" style="{{banner_html ? 'margin-top: -60px;' : ''}}">
    <div class="avatar-wrapper">
      {{avatar_html}}
    </div>
    <h1 class="name">{{nombre_perfil}}</h1>
    {{bio_html}}
    {{tags_html}}
  </header>

  <main class="container">
    <div class="blocks-section">
      {{bloques_html}}
    </div>
    {{archivos_section_html}}
    {{action_buttons_html}}
    
    <p class="brand">Creado con <a href="{{base_url}}">VYNK</a></p>
  </main>

  <footer class="save-bar">
    <a href="/api/perfiles/{{slug}}/vcard" class="save-btn">
      <i class="fas fa-address-card"></i> Guardar contacto
    </a>
  </footer>

  <!-- Intersection Observer for Scroll Animations -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry, index) => {
          if (entry.isIntersecting) {
            setTimeout(() => {
              entry.target.classList.add('visible');
            }, index * 100);
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1 });
      
      document.querySelector('.header').classList.add('visible');
      
      document.querySelectorAll('.block-wrapper, .section, .block-link, .block-wa, .block-embed, .block-text, .block-email, .block-countdown, .block-gallery, .block-socials').forEach(el => {
        if (!el.classList.contains('block-wrapper')) {
           // wait, block-wrapper is applied to all
        }
        observer.observe(el.closest('.block-wrapper') || el);
      });
    });
  </script>

  <!-- Countdown JS -->
  <script>
    document.querySelectorAll('[data-countdown]').forEach(function(el){
      var end = new Date(el.getAttribute('data-countdown')).getTime();
      function tick(){
        var now = Date.now(), d = Math.max(0, end - now);
        var days = Math.floor(d/86400000), hrs = Math.floor((d%86400000)/3600000);
        var mins = Math.floor((d%3600000)/60000), secs = Math.floor((d%60000)/1000);
        el.querySelector('.days').textContent = days.toString().padStart(2, '0');
        el.querySelector('.hours').textContent = hrs.toString().padStart(2, '0');
        el.querySelector('.minutes').textContent = mins.toString().padStart(2, '0');
        el.querySelector('.seconds').textContent = secs.toString().padStart(2, '0');
        if(d>0) requestAnimationFrame(tick);
      }
      tick(); setInterval(tick, 1000);
    });
  </script>

  <!-- Email capture -->
  <script>
    document.querySelectorAll('.block-email form').forEach(function(f){
      f.addEventListener('submit', function(e){
        e.preventDefault();
        var email = f.querySelector('input[type=email]').value;
        var pid = "{{perfil_id}}";
        var btn = f.querySelector('button');
        var ogText = btn.textContent;
        btn.textContent = 'Enviando...';
        btn.disabled = true;
        fetch('/api/perfiles/' + pid + '/suscribir', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({email: email})
        }).then(function(r){ return r.json(); }).then(function(d){
          if(d.ok){ f.innerHTML = '<p style="padding:16px;color:var(--profile-color);font-weight:bold;font-size:1.1rem;">✅ ¡Suscrito exitosamente!</p>'; }
          else { alert(d.error || 'Error'); btn.textContent = ogText; btn.disabled = false; }
        });
      });
    });
  </script>

  <!-- Analytics -->
  <script>
    (function(){
      var pid = "{{perfil_id}}";
      if(pid && navigator.sendBeacon){
        navigator.sendBeacon('/api/estadisticas',
          new Blob([JSON.stringify({perfil_id:pid,evento:'visita'})],{type:'application/json'})
        );
      }
      document.querySelectorAll('[data-action], a[href]').forEach(function(el){
        el.addEventListener('click',function(){
          var a = el.getAttribute('data-action') || 'click_link';
          if(pid && navigator.sendBeacon){
            navigator.sendBeacon('/api/estadisticas',
              new Blob([JSON.stringify({perfil_id:pid,evento:a})],{type:'application/json'})
            );
          }
        });
      });
    })();
  </script>

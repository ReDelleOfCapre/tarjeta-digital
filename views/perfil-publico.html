<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{nombre_perfil}} — My ID</title>
  <meta name="description" content="Tarjeta digital de {{nombre_perfil}}">
  <meta property="og:title" content="{{nombre_perfil}}">
  <meta property="og:description" content="Tarjeta digital de contacto">
  <meta property="og:image" content="{{og_image}}">
  <meta property="og:url" content="{{base_url}}/u/{{slug}}">
  <meta property="og:type" content="profile">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="{{color}}" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme: dark)">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: {{color}};
      --bg: #F2F2F7;
      --card: #FFFFFF;
      --text: #1C1C1E;
      --text2: #8E8E93;
      --sep: rgba(60,60,67,0.12);
      --r: 16px;
      color-scheme: light dark;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --card: #1C1C1E;
        --text: #FFFFFF;
        --text2: #8E8E93;
        --sep: rgba(84,84,88,0.65);
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.47;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    .container { max-width: 480px; margin: 0 auto; padding: 0 16px; }

    /* Header */
    .header { text-align: center; padding: 32px 16px 16px; }
    .avatar {
      width: 110px; height: 110px; border-radius: 50%; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 12px; font-weight: 700; color: #fff; font-size: 2.5rem;
      border: 3px solid var(--accent);
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .name { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.3px; }
    .bio { font-size: 0.8125rem; color: var(--text2); margin-top: 4px; max-width: 300px; margin-left: auto; margin-right: auto; }
    .tags { display: flex; justify-content: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .tag { background: var(--card); font-size: 0.6875rem; padding: 3px 10px; border-radius: 50px; color: var(--text2); }

    /* Action bar */
    .actions {
      position: sticky; top: 0; background: var(--card); border-bottom: 0.5px solid var(--sep);
      padding: 12px 16px; display: flex; justify-content: center; gap: 10px; z-index: 10;
    }
    .act-btn {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      font-size: 0.6875rem; min-width: 60px; padding: 8px 12px; border-radius: 12px;
      border: none; cursor: pointer; font-weight: 500; font-family: inherit;
      text-decoration: none; transition: transform 0.15s; color: #fff;
    }
    .act-btn:active { transform: scale(0.95); }
    .act-btn .ico { font-size: 1.2rem; }
    .wa { background: #25D366; }
    .ca { background: #34C759; }
    .em { background: #FF9500; }
    .sv { background: var(--card); color: var(--text); }

    /* Section */
    .section { padding: 16px 0; }
    .sec-title {
      color: var(--text2); font-size: 0.6875rem; text-transform: uppercase;
      letter-spacing: 0.5px; margin-bottom: 8px; padding: 0 16px; font-weight: 600;
    }

    /* Contact items */
    .item {
      display: flex; align-items: center; gap: 12px; padding: 12px 16px;
      text-decoration: none; color: inherit; border-bottom: 0.5px solid var(--sep);
      transition: background 0.15s;
    }
    .item:last-child { border-bottom: none; }
    .item:active { background: var(--card); }
    .item-ico {
      width: 36px; height: 36px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.875rem; color: #fff; flex-shrink: 0;
    }
    .item-info { flex: 1; min-width: 0; }
    .item-label { color: var(--text2); font-size: 0.6875rem; }
    .item-val { font-weight: 500; font-size: 0.9375rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-arrow { color: var(--text2); font-size: 0.875rem; }

    /* File items */
    .file {
      display: flex; align-items: center; gap: 12px; padding: 12px 16px;
      text-decoration: none; color: inherit; border-bottom: 0.5px solid var(--sep);
    }
    .file:last-child { border-bottom: none; }

    /* Save bar */
    .save-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 12px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom));
      background: var(--card); border-top: 0.5px solid var(--sep); z-index: 10;
    }
    .save-btn {
      display: flex; align-items: center; justify-content: center;
      width: 100%; padding: 14px; border-radius: 12px;
      font-weight: 600; font-size: 0.9375rem; cursor: pointer; border: none;
      background: var(--accent); color: #fff; text-decoration: none;
      font-family: inherit; gap: 8px;
    }
    .save-btn:active { opacity: 0.9; transform: scale(0.98); }

    .brand { text-align: center; color: var(--text2); font-size: 0.6875rem; padding: 16px; padding-bottom: 80px; }
    .brand a { color: var(--accent); }

    /* Animations */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    body { animation: fadeIn 0.3s ease; }
    .header { animation: slideUp 0.4s ease; }
    .item, .file { animation: fadeIn 0.3s ease backwards; }
    .item:nth-child(1) { animation-delay: 0.05s; }
    .item:nth-child(2) { animation-delay: 0.1s; }
    .item:nth-child(3) { animation-delay: 0.15s; }
    .item:nth-child(4) { animation-delay: 0.2s; }
    .item:nth-child(5) { animation-delay: 0.25s; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <header class="header">
    {{avatar_html}}
    <h1 class="name">{{nombre_perfil}}</h1>
    {{bio_html}}
    {{tags_html}}
  </header>

  <div class="actions">
    {{action_buttons_html}}
  </div>

  <main class="container">
    {{campos_section_html}}
    {{archivos_section_html}}
  </main>

  <footer class="save-bar">
    <a href="/api/perfiles/{{slug}}/vcard" class="save-btn">📥 Guardar contacto</a>
  </footer>

  <p class="brand">Creado con <a href="{{base_url}}">My ID</a></p>

  <script>
    (function(){
      var pid = {{perfil_id}};
      if (pid && navigator.sendBeacon) {
        navigator.sendBeacon('/api/estadisticas',
          new Blob([JSON.stringify({perfil_id:pid,evento:'visita'})],{type:'application/json'})
        );
      }
      document.querySelectorAll('[data-action]').forEach(function(btn){
        btn.addEventListener('click',function(){
          var action = btn.getAttribute('data-action');
          if (action && navigator.sendBeacon) {
            navigator.sendBeacon('/api/estadisticas',
              new Blob([JSON.stringify({perfil_id:pid,evento:action})],{type:'application/json'})
            );
          }
        });
      });
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Analíticas — VYNK</title>
  <meta name="theme-color" content="#0A0A0C">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* Analytics specific styles */
    .dashboard-page {
      padding-bottom: env(safe-area-inset-bottom, 20px);
    }
    
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    @media (min-width: 768px) {
      .stats-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .stat-card-glass {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .stat-title {
      font-size: var(--font-sm);
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
    }

    .charts-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      margin-bottom: 24px;
    }

    @media (min-width: 768px) {
      .charts-container {
        grid-template-columns: 2fr 1fr;
      }
    }

    .chart-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 20px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .chart-title {
      font-weight: 600;
      font-size: var(--font-md);
    }
    
    .chart-wrapper {
      position: relative;
      height: 250px;
      width: 100%;
    }

    .activity-feed {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .activity-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
    }

    .activity-list {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 300px;
      overflow-y: auto;
    }

    .activity-item {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .activity-item:last-child {
      border-bottom: none;
    }

    .activity-date {
      color: var(--text-muted);
      font-size: var(--font-sm);
    }

    .activity-count {
      font-weight: 600;
      background: var(--bg-secondary);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: var(--font-sm);
    }

    .profile-select {
      appearance: none;
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 8px 32px 8px 16px;
      border-radius: var(--radius-md);
      color: var(--text);
      font-size: var(--font-md);
      font-family: inherit;
      outline: none;
      cursor: pointer;
      background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%238e8e93' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 12px center;
    }

  </style>
</head>
<body class="dashboard-page">
  <nav class="navbar">
    <a href="dashboard.html" class="brand">
      <svg width="28" height="28" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="40" height="40" rx="12" fill="#EEEAFC"/>
        <path d="M12 14L20 28L28 14" stroke="#5C48E6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="28" cy="14" r="2.5" fill="#5C48E6"/>
      </svg>
      <span>VYNK Analíticas</span>
    </a>
    <div class="user-info">
      <span id="user-name"></span>
      <button class="btn btn-sm btn-ghost" id="btn-logout" style="color:var(--red)">Salir</button>
    </div>
  </nav>

  <div class="container">
    <div class="header-bar">
      <a href="dashboard.html" class="back-link">
        <span>←</span> Volver
      </a>
      <select id="profile-select" class="profile-select hidden">
        <!-- Opciones de perfiles -->
      </select>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card-glass">
        <div class="stat-title">Visitas Totales</div>
        <div class="stat-value" id="stat-visits">0</div>
      </div>
      <div class="stat-card-glass">
        <div class="stat-title">Interacciones</div>
        <div class="stat-value" id="stat-interactions">0</div>
      </div>
      <div class="stat-card-glass">
        <div class="stat-title">Tasa de Conversión</div>
        <div class="stat-value" id="stat-conversion">0%</div>
      </div>
      <div class="stat-card-glass">
        <div class="stat-title">Más Clicked</div>
        <div class="stat-value" id="stat-top-event" style="font-size: 18px; line-height: 32px;">-</div>
      </div>
    </div>

    <!-- Charts -->
    <div class="charts-container">
      <div class="chart-card">
        <div class="chart-header">
          <div class="chart-title">Visitas (Últimos 30 días)</div>
        </div>
        <div class="chart-wrapper">
          <canvas id="visitsChart"></canvas>
        </div>
      </div>
      <div class="chart-card">
        <div class="chart-header">
          <div class="chart-title">Interacciones por Tipo</div>
        </div>
        <div class="chart-wrapper">
          <canvas id="eventsChart"></canvas>
        </div>
      </div>
    </div>

    <!-- Activity -->
    <div class="activity-feed">
      <div class="activity-header">Actividad Reciente</div>
      <ul class="activity-list" id="activity-list">
        <!-- Tendencia datos renderizados como lista -->
      </ul>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script src="js/app.js"></script>
<script src="js/analytics.js"></script>
</body>
</html>

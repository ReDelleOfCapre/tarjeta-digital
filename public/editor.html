<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Editor — My ID</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="editor-page">
  <nav class="navbar">
    <div style="display:flex;align-items:center;gap:8px">
      <a href="/dashboard.html" class="btn btn-icon btn-sm">←</a>
      <span class="logo" id="page-title">Nueva tarjeta</span>
    </div>
    <button class="btn btn-ghost btn-sm" id="btn-save" style="font-weight:700">Guardar</button>
  </nav>

  <div class="container">
    <!-- Step indicator -->
    <div class="step-indicator">
      <div class="step-dot active" id="dot-1"></div>
      <div class="step-dot" id="dot-2"></div>
      <div class="step-dot" id="dot-3"></div>
    </div>

    <!-- STEP 1: Basic Info -->
    <div class="step-content" id="step-1">
      <h2 class="step-title">Datos básicos</h2>
      <p class="step-subtitle">La primera impresión de tu tarjeta</p>

      <!-- Photo -->
      <div class="photo-upload">
        <div class="photo-preview" id="photo-preview" onclick="document.getElementById('input-foto').click()">
          <span class="placeholder-text" id="photo-placeholder">📷</span>
          <img id="photo-img" style="display:none">
        </div>
        <button class="btn btn-sm btn-ghost" onclick="document.getElementById('input-foto').click()">Cambiar foto</button>
        <input type="file" id="input-foto" accept="image/jpeg,image/png,image/gif,image/webp" hidden>
        <p class="text-xs text-muted">JPG, PNG o GIF (máx 5MB)</p>
      </div>

      <div class="form-group">
        <label class="form-label">Nombre de la tarjeta *</label>
        <input type="text" class="form-input" id="nombre-perfil" placeholder="Ej: Giovanni Paolo" required>
      </div>

      <div class="form-group">
        <label class="form-label">Tipo</label>
        <select class="form-select" id="tipo-perfil">
          <option value="personal">Personal</option>
          <option value="profesional">Profesional</option>
          <option value="empresa">Empresa</option>
          <option value="freelancer">Freelancer</option>
          <option value="artista">Artista</option>
          <option value="streamer">Streamer</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Bio (opcional)</label>
        <textarea class="form-input" id="bio-perfil" placeholder="Cuéntales algo sobre ti..." rows="2" maxlength="160"></textarea>
      </div>

      <!-- Color -->
      <div class="form-group">
        <label class="form-label">Color de acento</label>
        <div class="color-options" id="color-options">
          <div class="color-option active" style="background:#007AFF" data-color="#007AFF"></div>
          <div class="color-option" style="background:#34C759" data-color="#34C759"></div>
          <div class="color-option" style="background:#FF9500" data-color="#FF9500"></div>
          <div class="color-option" style="background:#FF3B30" data-color="#FF3B30"></div>
          <div class="color-option" style="background:#AF52DE" data-color="#AF52DE"></div>
          <div class="color-option" style="background:#FF2D55" data-color="#FF2D55"></div>
          <div class="color-option" style="background:#5AC8FA" data-color="#5AC8FA"></div>
          <div class="color-option" style="background:#FFD60A" data-color="#FFD60A"></div>
          <div class="color-option" style="background:#1C1C1E" data-color="#1C1C1E"></div>
        </div>
      </div>

      <button class="btn btn-primary btn-block mt-16" onclick="goStep(2)">Siguiente →</button>
    </div>

    <!-- STEP 2: Contact Fields -->
    <div class="step-content hidden" id="step-2">
      <h2 class="step-title">Campos de contacto</h2>
      <p class="step-subtitle">Elige qué información compartir</p>

      <!-- Field type selector (chips) -->
      <div class="field-chips" id="field-chips"></div>

      <!-- Add field form -->
      <div class="card p-16 mb-16 hidden" id="add-field-form">
        <div class="form-group" style="margin-bottom:8px">
          <label class="form-label" id="field-type-label">Valor</label>
          <input type="text" class="form-input" id="field-value" placeholder="">
        </div>
        <div class="form-group" style="margin-bottom:8px">
          <label class="form-label">Etiqueta (opcional)</label>
          <input type="text" class="form-input" id="field-label" placeholder="Ej: Personal, Trabajo">
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-secondary btn-sm" onclick="cancelField()" style="flex:1">Cancelar</button>
          <button class="btn btn-primary btn-sm" onclick="saveField()" style="flex:1">Agregar</button>
        </div>
      </div>

      <!-- Added fields list -->
      <div class="added-fields" id="added-fields"></div>

      <div style="display:flex;gap:8px;margin-top:16px">
        <button class="btn btn-secondary" onclick="goStep(1)" style="flex:1">← Atrás</button>
        <button class="btn btn-primary" onclick="goStep(3)" style="flex:1">Siguiente →</button>
      </div>
    </div>

    <!-- STEP 3: Optional Info -->
    <div class="step-content hidden" id="step-3">
      <h2 class="step-title">Datos opcionales</h2>
      <p class="step-subtitle">Personaliza tu tarjeta aún más</p>

      <div class="form-group">
        <label class="form-label">🎂 Cumpleaños</label>
        <input type="text" class="form-input" id="cumpleanos" placeholder="Ej: 15 de Marzo">
      </div>

      <div class="form-group">
        <label class="form-label">📚 Lugar de estudio</label>
        <input type="text" class="form-input" id="lugar-estudio" placeholder="Ej: Universidad Veracruzana">
      </div>

      <div class="form-group">
        <label class="form-label">🏷️ Pronombres</label>
        <input type="text" class="form-input" id="pronombres" placeholder="Ej: él/she/they">
      </div>

      <div style="display:flex;gap:8px;margin-top:16px">
        <button class="btn btn-secondary" onclick="goStep(2)" style="flex:1">← Atrás</button>
        <button class="btn btn-primary" onclick="saveProfile()" id="btn-final-save" style="flex:1">💾 Guardar tarjeta</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>
  <script src="/js/app.js"></script>
  <script src="/js/editor.js"></script>
</body>
</html>

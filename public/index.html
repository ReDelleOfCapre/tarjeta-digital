<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My ID — Tu tarjeta digital</title>
  <meta name="description" content="Crea tu tarjeta de contacto digital y compártela con NFC, QR o link.">
  <meta name="theme-color" content="#007AFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0A84FF" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="auth-page">

  <div class="auth-header">
    <div class="brand-icon">🪪</div>
    <h1>My ID</h1>
    <p>Tu tarjeta digital inteligente</p>
  </div>

  <div class="container" style="flex:1">
    <div class="auth-form">
      <!-- Tabs -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login" onclick="showAuthTab('login')">Iniciar sesión</button>
        <button class="auth-tab" id="tab-registro" onclick="showAuthTab('registro')">Crear cuenta</button>
      </div>

      <!-- Login Form -->
      <form id="form-login" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Teléfono</label>
          <input type="tel" class="form-input" id="login-telefono" placeholder="Ej: 231 155 6138" required>
        </div>
        <div class="form-group">
          <label class="form-label">Contraseña</label>
          <input type="password" class="form-input" id="login-password" placeholder="Tu contraseña" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btn-login">Entrar</button>
      </form>

      <!-- Register Form (hidden) -->
      <form id="form-registro" class="hidden" onsubmit="handleRegistro(event)">
        <div class="form-group">
          <label class="form-label">Nombre completo</label>
          <input type="text" class="form-input" id="reg-nombre" placeholder="Tu nombre" required minlength="2">
        </div>
        <div class="form-group">
          <label class="form-label">Teléfono</label>
          <input type="tel" class="form-input" id="reg-telefono" placeholder="Ej: 231 155 6138" required>
        </div>
        <div class="form-group">
          <label class="form-label">Contraseña</label>
          <input type="password" class="form-input" id="reg-password" placeholder="Mínimo 6 caracteres" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btn-registro">Crear cuenta</button>
      </form>
    </div>
  </div>

  <p style="text-align:center;font-size:var(--font-xs);color:var(--text-muted);padding:16px 0">
    <a href="/legal.html" style="color:var(--text-tertiary)">Términos</a>
    &nbsp;·&nbsp;
    <a href="/legal.html#privacidad" style="color:var(--text-tertiary)">Privacidad</a>
  </p>

  <div class="toast-container" id="toast-container"></div>

  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - VYNK</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    :root {
      --primary: #7C3AED;
      --secondary: #FF6B6B;
      --bg-dark: #0F0B1E;
      --text-light: #F3F4F6;
      --card-bg: rgba(255, 255, 255, 0.05);
    }
    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background: rgba(15, 11, 30, 0.9);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .brand {
      font-size: 1.5rem;
      font-weight: 800;
      background: linear-gradient(to right, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    
    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
    }
    .stat-value {
      font-size: 2rem;
      font-weight: bold;
      color: var(--primary);
    }
    .stat-label {
      color: #9CA3AF;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Sections */
    .section-title {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      border-bottom: 2px solid var(--primary);
      display: inline-block;
      padding-bottom: 0.5rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      overflow-x: auto;
    }

    /* Tables */
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 1rem;
      text-align: left;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    th {
      color: #9CA3AF;
      font-weight: 600;
    }
    .btn-sm {
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-size: 0.8rem;
      margin-right: 0.5rem;
    }
    .btn-approve { background: #10B981; color: white; }
    .btn-reject { background: #EF4444; color: white; }
    .btn-view { background: #3B82F6; color: white; }
    .btn-toggle { background: var(--primary); color: white; }

    .badge {
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
      font-size: 0.8rem;
      background: rgba(255,255,255,0.1);
    }
    .badge.paid { background: rgba(16, 185, 129, 0.2); color: #10B981; }
    .badge.free { background: rgba(156, 163, 175, 0.2); color: #9CA3AF; }
    
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
    .modal.active { display: flex; }
    .modal-content { background: var(--bg-dark); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 2rem; width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .close-modal { background: none; border: none; color: #9CA3AF; font-size: 1.5rem; cursor: pointer; }
    .perfil-item { background: var(--card-bg); padding: 1rem; border-radius: 8px; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="brand">VYNK Admin</div>
    <div>
      <a href="/dashboard.html" style="color:white; text-decoration:none; margin-right: 15px;">Ir a mi panel</a>
      <button onclick="logout()" class="btn-sm" style="background:rgba(255,255,255,0.1); color:white">Salir</button>
    </div>
  </nav>

  <div class="container">
    <!-- Stats Overview -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="stat-users">0</div>
        <div class="stat-label">Total Usuarios</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-pro">0</div>
        <div class="stat-label">Usuarios Pro</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-revenue">$0</div>
        <div class="stat-label">Ingresos Mensuales</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-pending">0</div>
        <div class="stat-label">Pagos Pendientes</div>
      </div>
    </div>

    <!-- Pending Payments Queue -->
    <h2 class="section-title">Cola de Pagos Pendientes</h2>
    <div class="card">
      <table id="payments-table">
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Usuario</th>
            <th>Teléfono</th>
            <th>Plan</th>
            <th>Monto</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr><td colspan="6">Cargando pagos...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- User Management -->
    <h2 class="section-title">Gestión de Usuarios</h2>
    <div class="card">
      <table id="users-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Teléfono</th>
            <th>Plan</th>
            <th>Expira</th>
            <th>Perfiles</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr><td colspan="7">Cargando usuarios...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal Perfiles -->
  <div id="modal-perfiles" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-perfiles-title">Perfiles del Usuario</h2>
        <button class="close-modal" onclick="closePerfilesModal()">&times;</button>
      </div>
      <div id="modal-perfiles-list"></div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!localStorage.getItem('token')) {
        window.location.href = '/';
        return;
      }

      // Check admin role
      const user = getUser();
      if (!user || user.role !== 'admin') {
        alert('Acceso denegado. No eres administrador.');
        window.location.href = '/dashboard.html';
        return;
      }

      await loadDashboardData();
    });

    async function loadDashboardData() {
      try {
        // Load stats
        const statsRes = await api('/api/admin/stats');
        if (statsRes.usuarios) {
          document.getElementById('stat-users').textContent = statsRes.usuarios.total;
          document.getElementById('stat-pro').textContent = statsRes.usuarios.paid;
          document.getElementById('stat-revenue').textContent = '$' + (statsRes.ingresos || 0);
        }

        // Load pending payments
        const paymentsRes = await api('/api/admin/pagos');
        const tbodyPayments = document.querySelector('#payments-table tbody');
        if (paymentsRes.pagos) {
          document.getElementById('stat-pending').textContent = paymentsRes.pagos.length;
          tbodyPayments.innerHTML = paymentsRes.pagos.length === 0 
            ? '<tr><td colspan="6">No hay pagos pendientes</td></tr>' 
            : paymentsRes.pagos.map(p => `
              <tr>
                <td>${new Date(p.fecha_solicitud).toLocaleDateString()}</td>
                <td>${p.usuario_nombre}</td>
                <td>${p.usuario_telefono}</td>
                <td>${p.plan.toUpperCase()}</td>
                <td>$${p.monto}</td>
                <td>
                  <button class="btn-sm btn-view" onclick="window.open('${p.comprobante_url}', '_blank')">Ver Recibo</button>
                  <button class="btn-sm btn-approve" onclick="approvePayment(${p.id}, '${p.plan}')">Aprobar</button>
                  <button class="btn-sm btn-reject" onclick="rejectPayment(${p.id})">Rechazar</button>
                </td>
              </tr>
            `).join('');
        }

        // Load users
        const usersRes = await api('/api/admin/usuarios');
        const tbodyUsers = document.querySelector('#users-table tbody');
        if (usersRes.usuarios) {
          tbodyUsers.innerHTML = usersRes.usuarios.map(u => `
            <tr>
              <td>${u.id}</td>
              <td>${u.nombre}</td>
              <td>${u.telefono}</td>
              <td><span class="badge ${u.plan}">${u.plan.toUpperCase()}</span></td>
              <td>${u.plan_expira ? new Date(u.plan_expira).toLocaleDateString() : '-'}</td>
              <td>${u.total_perfiles}</td>
              <td>
                <button class="btn-sm btn-view" onclick="verPerfiles(${u.id}, '${u.nombre}')">Ver Tarjetas</button>
                <button class="btn-sm btn-toggle" onclick="togglePlan(${u.id}, '${u.plan === 'paid' ? 'free' : 'paid'}')">
                  Hacer ${u.plan === 'paid' ? 'Free' : 'Pro'}
                </button>
                ${u.plan === 'free' ? `<button class="btn-sm" style="background:#06B6D4; color:white;" onclick="resetQuota(${u.id})">Recargar Energía</button>` : ''}
              </td>
            </tr>
          `).join('');
        }

      } catch (err) {
        console.error('Error al cargar dashboard', err);
      }
    }

    async function resetQuota(userId) {
      if (!confirm('¿Recargar las 10 acciones de este usuario?')) return;
      try {
        const res = await api(`/api/admin/usuarios/${userId}/reset-quota`, { method: 'PUT' });
        if (res.ok) {
          alert('Energía recargada correctamente.');
        } else {
          alert('Error: ' + (res.error || 'No se pudo recargar'));
        }
      } catch (e) {
        alert('Error de conexión');
      }
    }

    async function approvePayment(id, planStr) {
      if (!confirm('¿Seguro que deseas aprobar este pago?')) return;
      const dias = planStr === 'anual' ? 365 : 30;
      
      try {
        const res = await api(`/api/admin/pagos/${id}/aprobar`, {
          method: 'PUT',
          body: JSON.stringify({ duracion_dias: dias })
        });
        if (res.ok) {
          alert('Pago aprobado y cuenta actualizada a Pro');
          loadDashboardData();
        } else {
          alert('Error: ' + res.error);
        }
      } catch (e) { alert('Error de conexión'); }
    }

    async function rejectPayment(id) {
      const motivo = prompt('Motivo del rechazo (opcional):');
      if (motivo === null) return;
      
      try {
        const res = await api(`/api/admin/pagos/${id}/rechazar`, {
          method: 'PUT',
          body: JSON.stringify({ motivo })
        });
        if (res.ok) {
          alert('Pago rechazado');
          loadDashboardData();
        } else {
          alert('Error: ' + res.error);
        }
      } catch (e) { alert('Error de conexión'); }
    }

    async function togglePlan(userId, newPlan) {
      if (!confirm(`¿Cambiar el plan del usuario a ${newPlan.toUpperCase()}?`)) return;
      
      try {
        const res = await api(`/api/admin/usuarios/${userId}/plan`, {
          method: 'PUT',
          body: JSON.stringify({ plan: newPlan })
        });
        if (res.ok) {
          loadDashboardData();
        } else {
          alert('Error: ' + res.error);
        }
      } catch (e) { alert('Error de conexión'); }
    }

    async function verPerfiles(userId, nombre) {
      document.getElementById('modal-perfiles-title').textContent = `Tarjetas de ${nombre}`;
      document.getElementById('modal-perfiles-list').innerHTML = '<p>Cargando tarjetas...</p>';
      document.getElementById('modal-perfiles').classList.add('active');

      try {
        const res = await api(`/api/admin/usuarios/${userId}/perfiles`);
        if (res.perfiles && res.perfiles.length > 0) {
          document.getElementById('modal-perfiles-list').innerHTML = res.perfiles.map(p => `
            <div class="perfil-item" id="perfil-item-${p.id}">
              <div>
                <strong>${p.slug}</strong><br>
                <span style="font-size:0.8rem; color:#9CA3AF">${p.visitas} visitas | ${p.total_campos} bloques</span>
              </div>
              <div>
                <button class="btn-sm btn-view" onclick="window.open('/${p.slug}', '_blank')">Abrir</button>
                <button class="btn-sm btn-reject" onclick="deletePerfilAdmin(${p.id})">Eliminar</button>
              </div>
            </div>
          `).join('');
        } else {
          document.getElementById('modal-perfiles-list').innerHTML = '<p>Este usuario no tiene tarjetas creadas.</p>';
        }
      } catch(e) {
        document.getElementById('modal-perfiles-list').innerHTML = '<p>Error al cargar tarjetas.</p>';
      }
    }

    function closePerfilesModal() {
      document.getElementById('modal-perfiles').classList.remove('active');
    }

    async function deletePerfilAdmin(perfilId) {
      if(!confirm('¿Seguro que deseas eliminar permanentemente esta tarjeta digital? Esta acción no se puede deshacer.')) return;
      try {
        const res = await api(`/api/admin/perfiles/${perfilId}`, { method: 'DELETE' });
        if(res.ok) {
          document.getElementById(`perfil-item-${perfilId}`).remove();
          loadDashboardData(); 
        } else {
          alert('Error: ' + res.error);
        }
      } catch(e) { alert('Error de conexión'); }
    }
  </script>
</body>
</html>
